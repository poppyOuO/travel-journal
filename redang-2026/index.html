const store={get:(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
let activeDay=0;
function renderDays(){dayStrip.innerHTML=days.map((x,i)=>`<button class="day-chip ${i===activeDay?'active':''}" data-day="${i}"><b>${x.d.slice(3)}</b><span>${x.w}</span></button>`).join('');dayStrip.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeDay=+b.dataset.day;renderDays();renderDay();});}
function renderDay(){const x=days[activeDay],notes=store.get('redang-notes',{});dayDetail.innerHTML=`<div class="day-heading"><div class="place">${x.place}</div><div class="sleep">今晚住：${x.sleep}</div><div class="day-status">${x.status}</div></div><div class="timeline">${x.events.map(e=>`<article class="event"><div class="event-time">${e.t}</div><div class="event-title">${e.title}</div><div class="event-desc">${e.desc}</div>${e.route?`<div class="transport"><div class="route"><div class="airport"><b>${e.route.a}</b><small>出发</small></div><div class="route-line"></div><div class="airport" style="text-align:right"><b>${e.route.b}</b><small>到达</small></div></div><div class="service"><span>${e.route.service}</span><span class="status pending">${e.route.state}</span></div>${e.route.facts?`<div class="flight-facts">${e.route.facts.map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div>`:''}</div>`:''}</article>`).join('')}</div><div class="note-box"><label>这一天的临时备注</label><textarea id="dayNote" placeholder="例如：潜店集合时间、餐厅、房号……">${notes[x.d]||''}</textarea><button class="note-save" id="saveNote">保存备注</button></div>`;saveNote.onclick=()=>{notes[x.d]=dayNote.value;store.set('redang-notes',notes);toast('备注已保存')};}
function renderBookings(){const checked=store.get('redang-bookings',{});bookingList.innerHTML=bookings.map(x=>`<label class="booking-item"><input type="checkbox" data-id="${x[0]}" ${checked[x[0]]?'checked':''}><div><b>${x[1]}</b><p>${x[2]}</p></div><em>${x[3]}</em></label>`).join('');bookingList.querySelectorAll('input').forEach(i=>i.onchange=()=>{checked[i.dataset.id]=i.checked;store.set('redang-bookings',checked);updateBookingCount();});updateBookingCount();}
function updateBookingCount(){const checked=store.get('redang-bookings',{}),n=bookings.filter(x=>!checked[x[0]]).length;pendingCount.textContent=n?`还有 ${n} 项待确认`:'确认事项已全部完成';}
function renderPacking(){const checked=store.get('redang-packing',{});packingList.innerHTML=Object.entries(packing).map(([group,items])=>`<section class="group ${group==='刘老师关注'?'focus-group':''} ${group==='9月27日必须完成'?'urgent-group':''}"><div class="group-head"><h3>${group}</h3><span>${items.length}项</span></div><div class="check-list">${items.map(x=>`<label class="check-row"><input type="checkbox" data-id="${x[0]}" ${checked[x[0]]?'checked':''}><span class="box"></span><span class="check-copy"><b>${x[1]}${x[2]==='待购买'?'<i class="buy-tag">待购买</i>':''}</b>${x[2]&&x[2]!=='待购买'?`<small>${x[2]}</small>`:''}</span></label>`).join('')}</div></section>`).join('');packingList.querySelectorAll('input').forEach(i=>i.onchange=()=>{checked[i.dataset.id]=i.checked;store.set('redang-packing',checked);updatePack();});updatePack();}
function updatePack(){const checked=store.get('redang-packing',{}),all=Object.values(packing).flat(),done=all.filter(x=>checked[x[0]]).length;packText.textContent=`${done} / ${all.length}`;packBar.style.width=`${done/all.length*100}%`;}
function switchScreen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-screen]').forEach(x=>x.classList.toggle('active',x.dataset.screen===id));scrollTo({top:0,behavior:'smooth'});}
document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>switchScreen(b.dataset.screen));
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1400)}
function setCountdown(){const target=new Date('2026-09-28T00:00:00+08:00'),now=new Date(),n=Math.ceil((target-now)/86400000);countdown.textContent=n>1?`还有 ${n} 天出发`:n===1?'明天出发':n===0?'今天出发':'旅途中';}
setCountdown();renderDays();renderDay();renderBookings();renderPacking();
